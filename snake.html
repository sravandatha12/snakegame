            border: 2px solid #ab3232;

        button {
            padding: 10px 15px;
            background-color: #424e57;
            color: rgb(11, 9, 9);

    <body>
        <div class="container">
        <h1>Snake Game</h1>
        <p>Use the arrow keys to control the snake.</p>
        <canvas id="gameCanvas" width="400" height="400" style="border:1px solid #b16969;"></canvas>
        <script>
            function playAgain() {
                alert("Game reset! You can start playing again.");
            }
        </script>
        <p>Enjoy the game!</p>
        <button id="playAgainBtn">Play Again</button>
        <button onclick="window.close()">Exit</button>
        <p>
        <button id="restartBtn">Restart</button>
        <br></br>

        <span>Score: <span id="score">0</span></span>
        <div id="gameOver" style="display:none; color: #e3d6d6; font-size: 24px; margin-top: 10px;">
            Game Over!
        </div>
        <script>
            // Simple Snake Game Logic
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const box = 20;
            let snake = [{ x: 9 * box, y: 10 * box }];
            let direction = 'RIGHT';
            let food = {
                x: Math.floor(Math.random() * 20) * box,
                y: Math.floor(Math.random() * 20) * box
            };
            let score = 0;
            let gameInterval;
            const scoreSpan = document.getElementById('score');
            const gameOverDiv = document.getElementById('gameOver');

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw snake
                for (let i = 0; i < snake.length; i++) {
                    ctx.fillStyle = i === 0 ? '#ab3232' : '#e3d6d6';
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                    ctx.strokeStyle = '#0e0d0d';
                    ctx.strokeRect(snake[i].x, snake[i].y, box, box);
                }

                // Draw food
                ctx.fillStyle = 'aqua';
                ctx.fillRect(food.x, food.y, box, box);

                // Move snake
                let head = { x: snake[0].x, y: snake[0].y };
                if (direction === 'LEFT') head.x -= box;
                if (direction === 'UP') head.y -= box;
                if (direction === 'RIGHT') head.x += box;
                if (direction === 'DOWN') head.y += box;

                // Check collision with food
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreSpan.textContent = score;
                    food = {
                        x: Math.floor(Math.random() * 20) * box,
                        y: Math.floor(Math.random() * 20) * box
                    };
                } else {
                    snake.pop();
                }

                // Check collision with walls
                if (
                    head.x < 0 || head.x >= canvas.width ||
                    head.y < 0 || head.y >= canvas.height ||
                    collision(head, snake)
                ) {
                    clearInterval(gameInterval);
                    gameOverDiv.style.display = 'block';
                }

                snake.unshift(head);
            }

            function collision(head, array) {
                for (let i = 0; i < array.length; i++) {
                    if (head.x === array[i].x && head.y === array[i].y) {
                        return true;
                    }
                }
                return false;
            }

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
                if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
                if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
                if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
            });

            function startGame() {
                snake = [{ x: 9 * box, y: 10 * box }];
                direction = 'RIGHT';
                score = 0;
                scoreSpan.textContent = score;
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
                const controlsDiv = document.getElementById('controls');
                        if (!controlsDiv) {
                            const newControls = document.createElement('div');
                            newControls.id = 'controls';
                            newControls.style.margin = '15px';
                            newControls.innerHTML = `
                                <button id="btnUp">Up</button>
                                <button id="btnLeft">Left</button>
                                <button id="btnDown">Down</button>
                                <button id="btnRight">Right</button>
                            `;
                            document.querySelector('.container').appendChild(newControls);

                            document.getElementById('btnUp').onclick = function() {
                                if (direction !== 'DOWN') direction = 'UP';
                            };
                            document.getElementById('btnLeft').onclick = function() {
                                if (direction !== 'RIGHT') direction = 'LEFT';
                            };
                            document.getElementById('btnDown').onclick = function() {
                                if (direction !== 'UP') direction = 'DOWN';
                            };
                            document.getElementById('btnRight').onclick = function() {
                                if (direction !== 'LEFT') direction = 'RIGHT';
                            };
                        }
                gameOverDiv.style.display = 'none';
                clearInterval(gameInterval);
                gameInterval = setInterval(draw, 200);
            }

            // Attach startGame to buttons
            document.getElementById('playAgainBtn').onclick = startGame;
            document.getElementById('restartBtn').onclick = startGame;

            // Start game on load
            startGame();
        </script>
        </p>
        </div>
    </body>
